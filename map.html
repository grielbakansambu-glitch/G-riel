<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>🗺️ Explorer G-RIEL — Carte du Garden</title>
    <link rel="icon" type="image/png" href="assets/images/ico.png" />
    <link rel="stylesheet" href="css/map.css" />
  </head>

  <body>
    <!-- Écran de chargement -->
    <div id="status">Chargement de la carte G-RIEL…</div>

    <!-- En-tête -->
    <div id="header-ui" class="panel">
      <h1>🗺️ G-RIEL IT Garden</h1>
      <p>Explorer la structure réelle du Garden</p>
      <div id="stats-badge">Chargement des données…</div>
    </div>

    <!-- Recherche -->
    <div id="search-panel" class="panel">
      <input
        id="search-input"
        type="search"
        placeholder="Rechercher une page, un lab, un PDF…"
        autocomplete="off"
      />
      <div id="search-result"></div>
    </div>

    <!-- Légende -->
    <div id="legend" class="panel">
      <div class="legend-item">
        <div class="legend-dot" style="background: #38bdf8"></div>
        Racine
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background: #a855f7"></div>
        Pages & identité
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background: #10b981"></div>
        Laboratoires
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background: #f59e0b"></div>
        Ressources & PDF
      </div>

      <div class="legend-item">
        <div class="legend-dot" style="background: #f87171"></div>
        Orphelin
      </div>
    </div>

    <!-- Informations sur le nœud sélectionné -->
    <div id="details-panel" class="panel">
      <h2 id="details-title"></h2>

      <p id="details-path"></p>

      <div id="details-meta"></div>

      <button id="details-open" class="control-btn">Ouvrir</button>
    </div>

    <!-- Contrôles -->
    <div id="controls">
      <button id="reset-view" class="control-btn">⊙ Recentrer</button>

      <button id="toggle-labels" class="control-btn">Aa Libellés</button>

      <button id="clear-selection" class="control-btn">✕ Effacer</button>
    </div>

    <!-- Zone graphique -->
    <div id="canvas-container"></div>

    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
      /*
       * ==========================================================
       * G-RIEL — Explorer
       * V3.1
       *
       * Le générateur produit la vérité structurelle :
       *      site-map.json
       *
       * Cette page ne crée aucune relation.
       * Elle ne fait que visualiser les relations existantes.
       * ==========================================================
       */

      const status = document.getElementById("status");
      const container = document.getElementById("canvas-container");
      const statsBadge = document.getElementById("stats-badge");

      const searchInput = document.getElementById("search-input");
      const searchResult = document.getElementById("search-result");

      const detailsPanel = document.getElementById("details-panel");
      const detailsTitle = document.getElementById("details-title");
      const detailsPath = document.getElementById("details-path");
      const detailsMeta = document.getElementById("details-meta");
      const detailsOpen = document.getElementById("details-open");

      const resetViewButton = document.getElementById("reset-view");
      const toggleLabelsButton = document.getElementById("toggle-labels");
      const clearSelectionButton = document.getElementById("clear-selection");

      let width = container.clientWidth;
      let height = container.clientHeight;

      let svg;
      let graph;
      let simulation;
      let zoom;

      let link;
      let node;
      let labels;

      let selectedNode = null;
      let labelsVisible = true;

      let originalNodes = [];
      let originalLinks = [];

      /*
       * ==========================================================
       * COULEURS
       * ==========================================================
       */

      function nodeColor(d) {
        if (d.group === "root") {
          return "#38bdf8";
        }

        if (d.group === "lab") {
          return "#10b981";
        }

        if (d.group === "project") {
          return "#f59e0b";
        }

        return "#a855f7";
      }

      /*
       * ==========================================================
       * CHARGEMENT
       * ==========================================================
       */

      d3.json("site-map.json")
        .then((data) => {
          originalNodes = data.nodes;
          originalLinks = data.links;

          statsBadge.textContent =
            `${data.stats.totalNodes} nœuds · ` +
            `${data.stats.totalLinks} relations · ` +
            `${data.stats.totalOrphans} orphelin(s)`;

          initializeGraph(data);

          status.style.display = "none";
        })
        .catch((error) => {
          console.error("Erreur lors du chargement de site-map.json :", error);

          status.classList.add("error");

          status.innerHTML = `
                    <div>
                        <strong>Impossible de charger site-map.json.</strong>
                        <br><br>
                        Vérifiez que le fichier existe à la racine du Garden
                        et que le générateur a bien été exécuté.
                    </div>
                `;
        });

      /*
       * ==========================================================
       * INITIALISATION DU GRAPHE
       * ==========================================================
       */

      function initializeGraph(data) {
        width = container.clientWidth;
        height = container.clientHeight;

        svg = d3
          .select("#canvas-container")
          .append("svg")
          .attr("width", "100%")
          .attr("height", "100%")
          .attr("viewBox", `0 0 ${width} ${height}`)
          .attr("preserveAspectRatio", "xMidYMid meet");

        graph = svg.append("g").attr("class", "graph");

        /*
         * Zoom / Pan
         */

        zoom = d3
          .zoom()
          .scaleExtent([0.15, 5])
          .on("zoom", (event) => {
            graph.attr("transform", event.transform);
          });

        svg.call(zoom);

        /*
         * Copie des données.
         *
         * D3 forceLink transforme source/target en objets.
         * On travaille donc sur des copies afin de ne pas
         * modifier inutilement les données originales.
         */

        const nodes = data.nodes.map((d) => ({
          ...d,
        }));

        const links = data.links.map((d) => ({
          ...d,
        }));

        /*
         * ======================================================
         * LIENS
         * ======================================================
         */

        link = graph
          .append("g")
          .attr("class", "links")
          .selectAll("line")
          .data(links)
          .join("line")
          .attr("class", "graph-link");

        /*
         * ======================================================
         * NŒUDS
         * ======================================================
         */

        node = graph
          .append("g")
          .attr("class", "nodes")
          .selectAll("circle")
          .data(nodes)
          .join("circle")
          .attr("class", "graph-node")
          .attr("r", (d) => {
            if (d.group === "root") {
              return 15;
            }

            if (d.group === "lab") {
              return 8;
            }

            if (d.isOrphan) {
              return 8;
            }

            return 6;
          })
          .attr("fill", (d) => nodeColor(d))
          .attr("stroke", (d) => (d.isOrphan ? "#f87171" : "#0b0f19"))
          .attr("stroke-width", (d) => (d.isOrphan ? 3 : 2))
          .on("click", handleNodeClick)
          .on("dblclick", (event, d) => {
            event.stopPropagation();

            if (d.url) {
              window.location.href = d.url;
            }
          })
          .call(
            d3
              .drag()
              .on("start", dragStarted)
              .on("drag", dragged)
              .on("end", dragEnded),
          );

        /*
         * ======================================================
         * LIBELLÉS
         * ======================================================
         */

        labels = graph
          .append("g")
          .attr("class", "labels")
          .selectAll("text")
          .data(nodes)
          .join("text")
          .attr("class", "graph-label")
          .text((d) => d.title)
          .attr("dx", 10)
          .attr("dy", 3);

        /*
         * ======================================================
         * SIMULATION
         * ======================================================
         *
         * Les liens sont volontairement plus courts et la
         * répulsion est plus forte pour éviter une masse trop
         * compacte avec les 356 relations.
         */

        simulation = d3
          .forceSimulation(nodes)

          .force(
            "link",
            d3
              .forceLink(links)
              .id((d) => d.id)
              .distance((d) => {
                /*
                 * Les liens existent réellement dans
                 * le dépôt : nous ne les supprimons pas.
                 *
                 * On donne simplement un peu plus
                 * d'espace aux relations.
                 */

                return 105;
              })
              .strength(0.28),
          )

          .force("charge", d3.forceManyBody().strength(-280).distanceMax(650))

          .force("center", d3.forceCenter(width / 2, height / 2))

          .force(
            "collision",
            d3
              .forceCollide()
              .radius((d) => {
                if (d.group === "root") {
                  return 25;
                }

                if (d.group === "lab") {
                  return 15;
                }

                return 12;
              })
              .strength(0.8),
          )

          .on("tick", ticked);

        /*
         * ======================================================
         * TICK
         * ======================================================
         */

        function ticked() {
          link
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);

          node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);

          labels.attr("x", (d) => d.x).attr("y", (d) => d.y);
        }
      }

      /*
       * ==========================================================
       * CLIC SUR UN NŒUD
       * ==========================================================
       */

      function handleNodeClick(event, d) {
        event.stopPropagation();

        selectedNode = d;

        showDetails(d);
        highlightConnections(d);
      }

      /*
       * ==========================================================
       * PANNEAU DÉTAILS
       * ==========================================================
       */

      function showDetails(d) {
        detailsPanel.style.display = "block";

        detailsTitle.textContent = d.title;

        detailsPath.textContent = d.path || d.url || "";

        const typeLabel = d.type === "pdf" ? "PDF" : "Page HTML";

        let groupLabel = "Page";

        if (d.group === "root") {
          groupLabel = "Racine";
        } else if (d.group === "lab") {
          groupLabel = "Laboratoire";
        } else if (d.group === "project") {
          groupLabel = "Ressource / Projet";
        }

        let orphanLabel = "";

        if (d.isOrphan) {
          orphanLabel = `<br><span style="color:#f87171">
                        ⚠️ Aucun lien entrant détecté
                    </span>`;
        }

        detailsMeta.innerHTML =
          `Type : ${typeLabel}<br>` + `Catégorie : ${groupLabel}` + orphanLabel;

        detailsOpen.onclick = () => {
          if (d.url) {
            window.location.href = d.url;
          }
        };
      }

      /*
       * ==========================================================
       * MISE EN ÉVIDENCE DES CONNEXIONS
       * ==========================================================
       */

      function highlightConnections(d) {
        /*
         * D'abord tout atténuer.
         */

        node.classed("node-dimmed", true);
        labels.classed("label-dimmed", true);

        link.classed("link-highlight", false);

        /*
         * Le nœud sélectionné reste visible.
         */

        node
          .filter((n) => n.id === d.id)
          .classed("node-dimmed", false)
          .classed("node-selected", true);

        labels.filter((n) => n.id === d.id).classed("label-dimmed", false);

        /*
         * Recherche des voisins directs.
         */

        const connectedIds = new Set();

        originalLinks.forEach((edge) => {
          const sourceId =
            typeof edge.source === "object" ? edge.source.id : edge.source;

          const targetId =
            typeof edge.target === "object" ? edge.target.id : edge.target;

          if (sourceId === d.id) {
            connectedIds.add(targetId);
          }

          if (targetId === d.id) {
            connectedIds.add(sourceId);
          }
        });

        /*
         * Afficher les voisins.
         */

        node
          .filter((n) => connectedIds.has(n.id))
          .classed("node-dimmed", false);

        labels
          .filter((n) => connectedIds.has(n.id))
          .classed("label-dimmed", false);

        /*
         * Afficher les liens connectés.
         */

        link
          .filter((edge) => {
            const sourceId =
              typeof edge.source === "object" ? edge.source.id : edge.source;

            const targetId =
              typeof edge.target === "object" ? edge.target.id : edge.target;

            return sourceId === d.id || targetId === d.id;
          })
          .classed("link-highlight", true);
      }

      /*
       * ==========================================================
       * EFFACER LA SÉLECTION
       * ==========================================================
       */

      function clearSelection() {
        selectedNode = null;

        detailsPanel.style.display = "none";

        node.classed("node-dimmed", false).classed("node-selected", false);

        labels.classed("label-dimmed", false);

        link.classed("link-highlight", false);
      }

      /*
       * Clic sur le fond
       */

      svgBackgroundClick();

      function svgBackgroundClick() {
        /*
         * Le listener est ajouté après le chargement
         * du SVG. Si svg n'existe pas encore, on attend.
         */

        if (!svg) {
          setTimeout(svgBackgroundClick, 100);
          return;
        }

        svg.on("click", (event) => {
          if (event.target.tagName === "svg") {
            clearSelection();
          }
        });
      }

      /*
       * ==========================================================
       * RECHERCHE
       * ==========================================================
       */

      searchInput.addEventListener("input", performSearch);

      function performSearch() {
        const query = searchInput.value.trim().toLowerCase();

        if (!query) {
          searchResult.style.display = "none";

          node.classed("node-search", false).classed("node-dimmed", false);

          return;
        }

        const matches = originalNodes.filter((d) => {
          const title = String(d.title || "").toLowerCase();

          const path = String(d.path || "").toLowerCase();

          return title.includes(query) || path.includes(query);
        });

        node.classed("node-search", (d) => matches.some((m) => m.id === d.id));

        if (matches.length === 0) {
          searchResult.style.display = "block";

          searchResult.textContent = "Aucun élément trouvé.";

          return;
        }

        searchResult.style.display = "block";

        searchResult.textContent = `${matches.length} résultat(s) trouvé(s).`;

        /*
         * Si une seule correspondance existe,
         * on la sélectionne automatiquement.
         */

        if (matches.length === 1) {
          const found = matches[0];

          const currentNode = node.filter((d) => d.id === found.id);

          if (!currentNode.empty()) {
            handleNodeClick(
              {
                stopPropagation: () => {},
              },
              found,
            );

            centerOnNode(found);
          }
        }
      }

      /*
       * ==========================================================
       * CENTRAGE SUR UN NŒUD
       * ==========================================================
       */

      function centerOnNode(d) {
        if (!d || !svg || !zoom) {
          return;
        }

        const scale = 1.5;

        const x = width / 2 - d.x * scale;

        const y = height / 2 - d.y * scale;

        svg
          .transition()
          .duration(700)
          .call(zoom.transform, d3.zoomIdentity.translate(x, y).scale(scale));
      }

      /*
       * ==========================================================
       * DRAG
       * ==========================================================
       */

      function dragStarted(event, d) {
        if (!event.active) {
          simulation.alphaTarget(0.25).restart();
        }

        d.fx = d.x;
        d.fy = d.y;
      }

      function dragged(event, d) {
        d.fx = event.x;
        d.fy = event.y;
      }

      function dragEnded(event, d) {
        if (!event.active) {
          simulation.alphaTarget(0);
        }

        d.fx = null;
        d.fy = null;
      }

      /*
       * ==========================================================
       * RECENTRER
       * ==========================================================
       */

      resetViewButton.addEventListener("click", () => {
        svg.transition().duration(700).call(zoom.transform, d3.zoomIdentity);

        simulation.alpha(0.35).restart();
      });

      /*
       * ==========================================================
       * AFFICHAGE DES LIBELLÉS
       * ==========================================================
       */

      toggleLabelsButton.addEventListener("click", () => {
        labelsVisible = !labelsVisible;

        labels.style("display", labelsVisible ? "block" : "none");
      });

      /*
       * ==========================================================
       * EFFACER
       * ==========================================================
       */

      clearSelectionButton.addEventListener("click", clearSelection);

      /*
       * ==========================================================
       * REDIMENSIONNEMENT
       * ==========================================================
       */

      window.addEventListener("resize", () => {
        if (!svg || !simulation) {
          return;
        }

        width = container.clientWidth;
        height = container.clientHeight;

        svg.attr("viewBox", `0 0 ${width} ${height}`);

        simulation
          .force("center", d3.forceCenter(width / 2, height / 2))
          .alpha(0.2)
          .restart();
      });
    </script>
    <script src="js/griel-assistant.js"></script>
  </body>
</html>
