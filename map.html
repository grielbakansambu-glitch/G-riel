<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🗺️ Explorer G-RIEL — Carte du Garden</title>

    <style>
    :root {
        --bg: #f4f6f8;             /* Fond général en blanc cassé très doux */
        --panel: rgba(255, 255, 255, 0.88); /* Panneaux blancs translucides avec effet verre */
        --panel-border: rgba(56, 189, 248, 0.3); /* Bordure subtilement bleutée */
        --text: #1e293b;           /* Texte sombre et contrasté pour une excellente lisibilité */
        --muted: #64748b;          /* Texte secondaire gris moyen */
        --cyan: #0284c7;           /* Cyan ajusté pour un meilleur contraste sur fond clair */
        --green: #059669;          /* Vert accentué */
        --purple: #7e22ce;         /* Violet accentué */
        --orange: #d97706;         /* Orange accentué */
        --red: #dc2626;            /* Rouge accentué */
        --line: #cbd5e1;           /* Lignes du graphe plus visibles sur fond clair */
    }

    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
    }

    body {
        position: relative;
    }

    /* =========================
        INTERFACE
    ========================= */

    .panel {
        position: absolute;
        z-index: 20;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08); /* Ombre douce et légère pour le mode clair */
    }

    #header-ui {
        top: 18px;
        left: 18px;
        width: min(390px, calc(100vw - 36px));
        padding: 15px 18px;
        border-radius: 14px;
    }

    #header-ui h1 {
        margin: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.08rem;
        color: var(--cyan);
    }

    #header-ui p {
        margin: 5px 0 0;
        font-size: 0.78rem;
        color: var(--muted);
    }

    #stats-badge {
        margin-top: 8px;
        font-size: 0.74rem;
        color: var(--green);
        font-weight: 600;
    }

    /* =========================
        SEARCH
    ========================= */

    #search-panel {
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        width: min(360px, calc(100vw - 36px));
        padding: 8px;
        border-radius: 12px;
    }

    #search-input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        outline: none;
        background: #ffffff;
        color: var(--text);
        font-size: 0.82rem;
    }

    #search-input::placeholder {
        color: #94a3b8;
    }

    #search-input:focus {
        border-color: var(--cyan);
    }

    #search-result {
        display: none;
        margin-top: 7px;
        padding: 7px 9px;
        border-radius: 7px;
        background: #f1f5f9;
        color: var(--muted);
        font-size: 0.72rem;
    }

    /* =========================
        LEGEND
    ========================= */

    #legend {
        top: 18px;
        right: 18px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.72rem;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        white-space: nowrap;
    }

    .legend-item:last-child {
        margin-bottom: 0;
    }

    .legend-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 9px;
        border-radius: 50%;
    }

    /* =========================
        CONTROLS
    ========================= */

    #controls {
        position: absolute;
        z-index: 20;
        left: 18px;
        bottom: 18px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }

    .control-btn {
        padding: 9px 13px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #ffffff;
        color: #334155;
        cursor: pointer;
        font-size: 0.78rem;
        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            color 0.2s ease;
    }

    .control-btn:hover {
        background: var(--cyan);
        border-color: var(--cyan);
        color: #ffffff;
    }

    /* =========================
        DETAILS
    ========================= */

    #details-panel {
        right: 18px;
        bottom: 18px;
        width: min(330px, calc(100vw - 36px));
        padding: 15px;
        border-radius: 12px;
        display: none;
    }

    #details-title {
        margin: 0 0 7px;
        color: var(--cyan);
        font-size: 0.95rem;
    }

    #details-path {
        margin: 0;
        color: var(--muted);
        font-size: 0.72rem;
        line-height: 1.5;
        word-break: break-word;
    }

    #details-meta {
        margin-top: 10px;
        color: #334155;
        font-size: 0.72rem;
        line-height: 1.6;
    }

    #details-open {
        margin-top: 11px;
        width: 100%;
    }

    /* =========================
        CANVAS
    ========================= */

    #canvas-container {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        cursor: grab;
    }

    #canvas-container:active {
        cursor: grabbing;
    }

    svg {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* =========================
        GRAPH
    ========================= */

    .graph-link {
        stroke: var(--line);
        stroke-opacity: 0.45; /* Légèrement plus opaque pour bien ressortir sur le fond clair */
        stroke-width: 1;
        transition:
            stroke-opacity 0.2s ease,
            stroke-width 0.2s ease;
    }

    .graph-link.link-highlight {
        stroke: var(--cyan);
        stroke-opacity: 0.9;
        stroke-width: 2;
    }

    .graph-node {
        stroke: var(--bg);
        stroke-width: 2;
        cursor: pointer;
    }

    .graph-node.node-dimmed {
        opacity: 0.18;
    }

    .graph-node.node-selected,
    .graph-node.node-search {
        stroke: #0f172a; /* Bordure sombre contrastée pour la sélection */
        stroke-width: 3;
    }

    .graph-label {
        fill: #334155; /* Texte des labels plus sombre pour la lisibilité */
        font-size: 9px;
        pointer-events: none;
        user-select: none;
    }

    .graph-label.label-dimmed {
        opacity: 0.12;
    }

    /* =========================
        LOADING / ERROR
    ========================= */

    #status {
        position: absolute;
        z-index: 30;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--muted);
        font-size: 0.9rem;
    }

    #status.error {
        color: var(--red);
        text-align: center;
        padding: 30px;
    }

    @media (max-width: 800px) {

        /* =========================
            HEADER MOBILE
        ========================= */

        #header-ui {
            top: 10px;
            left: 10px;
            right: 10px;
            width: auto;
            padding: 10px 12px;
        }

        #header-ui h1 {
            font-size: 0.92rem;
        }

        #header-ui p {
            font-size: 0.68rem;
            margin-top: 4px;
        }

        #stats-badge {
            font-size: 0.66rem;
            margin-top: 6px;
        }


        /* =========================
            RECHERCHE MOBILE
        ========================= */

        #search-panel {
            top: auto;
            bottom: 62px;
            left: 10px;
            right: 10px;
            width: auto;
            transform: none;
        }

        #search-input {
            font-size: 0.78rem;
            padding: 8px 10px;
        }


        /* =========================
            LÉGENDE MOBILE
        ========================= */

        #legend {
            top: auto;
            right: 10px;
            bottom: 150px;
            padding: 8px 10px;
            font-size: 0.62rem;
        }

        .legend-item {
            gap: 6px;
            margin-bottom: 5px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            flex-basis: 8px;
        }


        /* =========================
            CONTRÔLES MOBILE
        ========================= */

        #controls {
            left: 10px;
            right: 10px;
            bottom: 10px;
            gap: 6px;
        }

        .control-btn {
            padding: 7px 9px;
            font-size: 0.66rem;
        }


        /* =========================
            PANNEAU DÉTAILS MOBILE
        ========================= */

        #details-panel {
            left: 10px;
            right: 10px;
            bottom: 115px;
            width: auto;
            max-height: 30vh;
            overflow-y: auto;
            padding: 12px;
        }

        #details-title {
            font-size: 0.88rem;
        }

        #details-path,
        #details-meta {
            font-size: 0.68rem;
        }


        /* =========================
            LABELS DU GRAPHE
        ========================= */

        .graph-label {
            font-size: 8px;
        }
    }
</style>
</head>

<body>

    <!-- Écran de chargement -->
    <div id="status">
        Chargement de la carte G-RIEL…
    </div>

    <!-- En-tête -->
    <div id="header-ui" class="panel">
        <h1>🗺️ G-RIEL IT Garden</h1>
        <p>Explorer la structure réelle du Garden</p>
        <div id="stats-badge">
            Chargement des données…
        </div>
    </div>

    <!-- Recherche -->
    <div id="search-panel" class="panel">
        <input
            id="search-input"
            type="search"
            placeholder="Rechercher une page, un lab, un PDF…"
            autocomplete="off"
        >
        <div id="search-result"></div>
    </div>

    <!-- Légende -->
    <div id="legend" class="panel">

        <div class="legend-item">
            <div class="legend-dot" style="background:#38bdf8"></div>
            Racine
        </div>

        <div class="legend-item">
            <div class="legend-dot" style="background:#a855f7"></div>
            Pages & identité
        </div>

        <div class="legend-item">
            <div class="legend-dot" style="background:#10b981"></div>
            Laboratoires
        </div>

        <div class="legend-item">
            <div class="legend-dot" style="background:#f59e0b"></div>
            Ressources & PDF
        </div>

        <div class="legend-item">
            <div class="legend-dot" style="background:#f87171"></div>
            Orphelin
        </div>

    </div>

    <!-- Informations sur le nœud sélectionné -->
    <div id="details-panel" class="panel">

        <h2 id="details-title"></h2>

        <p id="details-path"></p>

        <div id="details-meta"></div>

        <button
            id="details-open"
            class="control-btn"
        >
            Ouvrir
        </button>

    </div>

    <!-- Contrôles -->
    <div id="controls">

        <button
            id="reset-view"
            class="control-btn"
        >
            ⊙ Recentrer
        </button>

        <button
            id="toggle-labels"
            class="control-btn"
        >
            Aa Libellés
        </button>

        <button
            id="clear-selection"
            class="control-btn"
        >
            ✕ Effacer
        </button>

    </div>

    <!-- Zone graphique -->
    <div id="canvas-container"></div>

    <!-- D3 -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <script>
        /*
         * ==========================================================
         * G-RIEL — Explorer
         * V3.1
         *
         * Le générateur produit la vérité structurelle :
         *      site-map.json
         *
         * Cette page ne crée aucune relation.
         * Elle ne fait que visualiser les relations existantes.
         * ==========================================================
         */

        const status = document.getElementById("status");
        const container = document.getElementById("canvas-container");
        const statsBadge = document.getElementById("stats-badge");

        const searchInput = document.getElementById("search-input");
        const searchResult = document.getElementById("search-result");

        const detailsPanel = document.getElementById("details-panel");
        const detailsTitle = document.getElementById("details-title");
        const detailsPath = document.getElementById("details-path");
        const detailsMeta = document.getElementById("details-meta");
        const detailsOpen = document.getElementById("details-open");

        const resetViewButton = document.getElementById("reset-view");
        const toggleLabelsButton = document.getElementById("toggle-labels");
        const clearSelectionButton = document.getElementById("clear-selection");

        let width = container.clientWidth;
        let height = container.clientHeight;

        let svg;
        let graph;
        let simulation;
        let zoom;

        let link;
        let node;
        let labels;

        let selectedNode = null;
        let labelsVisible = true;

        let originalNodes = [];
        let originalLinks = [];

        /*
         * ==========================================================
         * COULEURS
         * ==========================================================
         */

        function nodeColor(d) {

            if (d.group === "root") {
                return "#38bdf8";
            }

            if (d.group === "lab") {
                return "#10b981";
            }

            if (d.group === "project") {
                return "#f59e0b";
            }

            return "#a855f7";
        }

        /*
         * ==========================================================
         * CHARGEMENT
         * ==========================================================
         */

        d3.json("site-map.json")
            .then(data => {

                originalNodes = data.nodes;
                originalLinks = data.links;

                statsBadge.textContent =
                    `${data.stats.totalNodes} nœuds · ` +
                    `${data.stats.totalLinks} relations · ` +
                    `${data.stats.totalOrphans} orphelin(s)`;

                initializeGraph(data);

                status.style.display = "none";

            })
            .catch(error => {

                console.error(
                    "Erreur lors du chargement de site-map.json :",
                    error
                );

                status.classList.add("error");

                status.innerHTML = `
                    <div>
                        <strong>Impossible de charger site-map.json.</strong>
                        <br><br>
                        Vérifiez que le fichier existe à la racine du Garden
                        et que le générateur a bien été exécuté.
                    </div>
                `;
            });


        /*
         * ==========================================================
         * INITIALISATION DU GRAPHE
         * ==========================================================
         */

        function initializeGraph(data) {

            width = container.clientWidth;
            height = container.clientHeight;

            svg = d3.select("#canvas-container")
                .append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            graph = svg.append("g")
                .attr("class", "graph");

            /*
             * Zoom / Pan
             */

            zoom = d3.zoom()
                .scaleExtent([0.15, 5])
                .on("zoom", event => {

                    graph.attr(
                        "transform",
                        event.transform
                    );

                });

            svg.call(zoom);

            /*
             * Copie des données.
             *
             * D3 forceLink transforme source/target en objets.
             * On travaille donc sur des copies afin de ne pas
             * modifier inutilement les données originales.
             */

            const nodes = data.nodes.map(d => ({
                ...d
            }));

            const links = data.links.map(d => ({
                ...d
            }));

            /*
             * ======================================================
             * LIENS
             * ======================================================
             */

            link = graph
                .append("g")
                .attr("class", "links")
                .selectAll("line")
                .data(links)
                .join("line")
                .attr("class", "graph-link");

            /*
             * ======================================================
             * NŒUDS
             * ======================================================
             */

            node = graph
                .append("g")
                .attr("class", "nodes")
                .selectAll("circle")
                .data(nodes)
                .join("circle")
                .attr("class", "graph-node")
                .attr("r", d => {

                    if (d.group === "root") {
                        return 15;
                    }

                    if (d.group === "lab") {
                        return 8;
                    }

                    if (d.isOrphan) {
                        return 8;
                    }

                    return 6;

                })
                .attr("fill", d => nodeColor(d))
                .attr("stroke", d =>
                    d.isOrphan
                        ? "#f87171"
                        : "#0b0f19"
                )
                .attr("stroke-width", d =>
                    d.isOrphan
                        ? 3
                        : 2
                )
                .on("click", handleNodeClick)
                .on("dblclick", (event, d) => {

                    event.stopPropagation();

                    if (d.url) {
                        window.location.href = d.url;
                    }

                })
                .call(
                    d3.drag()
                        .on("start", dragStarted)
                        .on("drag", dragged)
                        .on("end", dragEnded)
                );

            /*
             * ======================================================
             * LIBELLÉS
             * ======================================================
             */

            labels = graph
                .append("g")
                .attr("class", "labels")
                .selectAll("text")
                .data(nodes)
                .join("text")
                .attr("class", "graph-label")
                .text(d => d.title)
                .attr("dx", 10)
                .attr("dy", 3);

            /*
             * ======================================================
             * SIMULATION
             * ======================================================
             *
             * Les liens sont volontairement plus courts et la
             * répulsion est plus forte pour éviter une masse trop
             * compacte avec les 356 relations.
             */

            simulation = d3.forceSimulation(nodes)

                .force(
                    "link",
                    d3.forceLink(links)
                        .id(d => d.id)
                        .distance(d => {

                            /*
                             * Les liens existent réellement dans
                             * le dépôt : nous ne les supprimons pas.
                             *
                             * On donne simplement un peu plus
                             * d'espace aux relations.
                             */

                            return 105;
                        })
                        .strength(0.28)
                )

                .force(
                    "charge",
                    d3.forceManyBody()
                        .strength(-280)
                        .distanceMax(650)
                )

                .force(
                    "center",
                    d3.forceCenter(
                        width / 2,
                        height / 2
                    )
                )

                .force(
                    "collision",
                    d3.forceCollide()
                        .radius(d => {

                            if (d.group === "root") {
                                return 25;
                            }

                            if (d.group === "lab") {
                                return 15;
                            }

                            return 12;
                        })
                        .strength(0.8)
                )

                .on("tick", ticked);

            /*
             * ======================================================
             * TICK
             * ======================================================
             */

            function ticked() {

                link
                    .attr("x1", d => d.source.x)
                    .attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x)
                    .attr("y2", d => d.target.y);

                node
                    .attr("cx", d => d.x)
                    .attr("cy", d => d.y);

                labels
                    .attr("x", d => d.x)
                    .attr("y", d => d.y);
            }
        }


        /*
         * ==========================================================
         * CLIC SUR UN NŒUD
         * ==========================================================
         */

        function handleNodeClick(event, d) {

            event.stopPropagation();

            selectedNode = d;

            showDetails(d);
            highlightConnections(d);
        }


        /*
         * ==========================================================
         * PANNEAU DÉTAILS
         * ==========================================================
         */

        function showDetails(d) {

            detailsPanel.style.display = "block";

            detailsTitle.textContent = d.title;

            detailsPath.textContent =
                d.path || d.url || "";

            const typeLabel =
                d.type === "pdf"
                    ? "PDF"
                    : "Page HTML";

            let groupLabel = "Page";

            if (d.group === "root") {
                groupLabel = "Racine";
            }
            else if (d.group === "lab") {
                groupLabel = "Laboratoire";
            }
            else if (d.group === "project") {
                groupLabel = "Ressource / Projet";
            }

            let orphanLabel = "";

            if (d.isOrphan) {
                orphanLabel =
                    `<br><span style="color:#f87171">
                        ⚠️ Aucun lien entrant détecté
                    </span>`;
            }

            detailsMeta.innerHTML =
                `Type : ${typeLabel}<br>` +
                `Catégorie : ${groupLabel}` +
                orphanLabel;

            detailsOpen.onclick = () => {

                if (d.url) {
                    window.location.href = d.url;
                }

            };
        }


        /*
         * ==========================================================
         * MISE EN ÉVIDENCE DES CONNEXIONS
         * ==========================================================
         */

        function highlightConnections(d) {

            /*
             * D'abord tout atténuer.
             */

            node.classed("node-dimmed", true);
            labels.classed("label-dimmed", true);

            link
                .classed("link-highlight", false);

            /*
             * Le nœud sélectionné reste visible.
             */

            node
                .filter(n => n.id === d.id)
                .classed("node-dimmed", false)
                .classed("node-selected", true);

            labels
                .filter(n => n.id === d.id)
                .classed("label-dimmed", false);

            /*
             * Recherche des voisins directs.
             */

            const connectedIds = new Set();

            originalLinks.forEach(edge => {

                const sourceId =
                    typeof edge.source === "object"
                        ? edge.source.id
                        : edge.source;

                const targetId =
                    typeof edge.target === "object"
                        ? edge.target.id
                        : edge.target;

                if (sourceId === d.id) {
                    connectedIds.add(targetId);
                }

                if (targetId === d.id) {
                    connectedIds.add(sourceId);
                }
            });

            /*
             * Afficher les voisins.
             */

            node
                .filter(n =>
                    connectedIds.has(n.id)
                )
                .classed("node-dimmed", false);

            labels
                .filter(n =>
                    connectedIds.has(n.id)
                )
                .classed("label-dimmed", false);

            /*
             * Afficher les liens connectés.
             */

            link
                .filter(edge => {

                    const sourceId =
                        typeof edge.source === "object"
                            ? edge.source.id
                            : edge.source;

                    const targetId =
                        typeof edge.target === "object"
                            ? edge.target.id
                            : edge.target;

                    return (
                        sourceId === d.id ||
                        targetId === d.id
                    );
                })
                .classed("link-highlight", true);
        }


        /*
         * ==========================================================
         * EFFACER LA SÉLECTION
         * ==========================================================
         */

        function clearSelection() {

            selectedNode = null;

            detailsPanel.style.display = "none";

            node
                .classed("node-dimmed", false)
                .classed("node-selected", false);

            labels
                .classed("label-dimmed", false);

            link
                .classed("link-highlight", false);
        }


        /*
         * Clic sur le fond
         */

        svgBackgroundClick();

        function svgBackgroundClick() {

            /*
             * Le listener est ajouté après le chargement
             * du SVG. Si svg n'existe pas encore, on attend.
             */

            if (!svg) {
                setTimeout(svgBackgroundClick, 100);
                return;
            }

            svg.on("click", event => {

                if (event.target.tagName === "svg") {
                    clearSelection();
                }

            });
        }


        /*
         * ==========================================================
         * RECHERCHE
         * ==========================================================
         */

        searchInput.addEventListener(
            "input",
            performSearch
        );

        function performSearch() {

            const query =
                searchInput.value
                    .trim()
                    .toLowerCase();

            if (!query) {

                searchResult.style.display = "none";

                node
                    .classed("node-search", false)
                    .classed("node-dimmed", false);

                return;
            }

            const matches =
                originalNodes.filter(d => {

                    const title =
                        String(d.title || "")
                            .toLowerCase();

                    const path =
                        String(d.path || "")
                            .toLowerCase();

                    return (
                        title.includes(query) ||
                        path.includes(query)
                    );
                });

            node.classed("node-search", d =>
                matches.some(m => m.id === d.id)
            );

            if (matches.length === 0) {

                searchResult.style.display = "block";

                searchResult.textContent =
                    "Aucun élément trouvé.";

                return;
            }

            searchResult.style.display = "block";

            searchResult.textContent =
                `${matches.length} résultat(s) trouvé(s).`;

            /*
             * Si une seule correspondance existe,
             * on la sélectionne automatiquement.
             */

            if (matches.length === 1) {

                const found = matches[0];

                const currentNode =
                    node.filter(d => d.id === found.id);

                if (!currentNode.empty()) {

                    handleNodeClick(
                        {
                            stopPropagation: () => {}
                        },
                        found
                    );

                    centerOnNode(found);
                }
            }
        }


        /*
         * ==========================================================
         * CENTRAGE SUR UN NŒUD
         * ==========================================================
         */

        function centerOnNode(d) {

            if (!d || !svg || !zoom) {
                return;
            }

            const scale = 1.5;

            const x =
                width / 2 -
                d.x * scale;

            const y =
                height / 2 -
                d.y * scale;

            svg
                .transition()
                .duration(700)
                .call(
                    zoom.transform,
                    d3.zoomIdentity
                        .translate(x, y)
                        .scale(scale)
                );
        }


        /*
         * ==========================================================
         * DRAG
         * ==========================================================
         */

        function dragStarted(event, d) {

            if (!event.active) {
                simulation.alphaTarget(0.25).restart();
            }

            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {

            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {

            if (!event.active) {
                simulation.alphaTarget(0);
            }

            d.fx = null;
            d.fy = null;
        }


        /*
         * ==========================================================
         * RECENTRER
         * ==========================================================
         */

        resetViewButton.addEventListener(
            "click",
            () => {

                svg
                    .transition()
                    .duration(700)
                    .call(
                        zoom.transform,
                        d3.zoomIdentity
                    );

                simulation
                    .alpha(0.35)
                    .restart();
            }
        );


        /*
         * ==========================================================
         * AFFICHAGE DES LIBELLÉS
         * ==========================================================
         */

        toggleLabelsButton.addEventListener(
            "click",
            () => {

                labelsVisible = !labelsVisible;

                labels.style(
                    "display",
                    labelsVisible
                        ? "block"
                        : "none"
                );
            }
        );


        /*
         * ==========================================================
         * EFFACER
         * ==========================================================
         */

        clearSelectionButton.addEventListener(
            "click",
            clearSelection
        );


        /*
         * ==========================================================
         * REDIMENSIONNEMENT
         * ==========================================================
         */

        window.addEventListener(
            "resize",
            () => {

                if (!svg || !simulation) {
                    return;
                }

                width = container.clientWidth;
                height = container.clientHeight;

                svg.attr(
                    "viewBox",
                    `0 0 ${width} ${height}`
                );

                simulation
                    .force(
                        "center",
                        d3.forceCenter(
                            width / 2,
                            height / 2
                        )
                    )
                    .alpha(0.2)
                    .restart();
            }
        );

    </script>

</body>
</html>
